<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Fondo -->
  <rect x="0" y="0" width="960" height="600" rx="14" fill="#ffffff"/>
  <text x="480" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Registro de alumnos · Arquitectura con Supabase</text>

  <!-- ================= NAVEGADOR ================= -->
  <rect x="30" y="70" width="330" height="360" rx="12" fill="#eef4ff" stroke="#3b6fd8" stroke-width="2"/>
  <text x="195" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Navegador (Vite · npm run dev)</text>

  <rect x="50" y="120" width="290" height="60" rx="8" fill="#ffffff" stroke="#93b4f0"/>
  <text x="195" y="145" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">index.html + styles.css</text>
  <text x="195" y="166" text-anchor="middle" font-size="12" fill="#475569">Formulario y lista de registros</text>

  <rect x="50" y="195" width="290" height="60" rx="8" fill="#ffffff" stroke="#93b4f0"/>
  <text x="195" y="220" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">app.js</text>
  <text x="195" y="241" text-anchor="middle" font-size="12" fill="#475569">submit · cargarRegistros() · eliminarRegistro()</text>

  <rect x="50" y="270" width="290" height="60" rx="8" fill="#ffffff" stroke="#93b4f0"/>
  <text x="195" y="295" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">supabase-js v2 (CDN)</text>
  <text x="195" y="316" text-anchor="middle" font-size="12" fill="#475569">createClient(URL, clave publicable)</text>

  <rect x="50" y="345" width="290" height="65" rx="8" fill="#fff8e6" stroke="#e0b44c"/>
  <text x="195" y="368" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">.env (no se sube a git)</text>
  <text x="195" y="386" text-anchor="middle" font-size="11.5" font-family="Consolas, Menlo, monospace" fill="#475569">VITE_SUPABASE_URL</text>
  <text x="195" y="401" text-anchor="middle" font-size="11.5" font-family="Consolas, Menlo, monospace" fill="#475569">VITE_SUPABASE_PUBLISHABLE_KEY</text>

  <!-- flechas internas navegador -->
  <line x1="195" y1="180" x2="195" y2="194" stroke="#475569" stroke-width="1.5" marker-end="url(#flecha)"/>
  <line x1="195" y1="255" x2="195" y2="269" stroke="#475569" stroke-width="1.5" marker-end="url(#flecha)"/>
  <line x1="195" y1="345" x2="195" y2="331" stroke="#475569" stroke-width="1.5" marker-end="url(#flecha)"/>

  <!-- ================= PETICIONES ================= -->
  <g font-size="11.5" font-family="Consolas, Menlo, monospace" fill="#0f172a" text-anchor="middle">
    <text x="480" y="152"><tspan font-weight="700" fill="#2563eb">INSERT</tspan> .insert([{...}])</text>
    <line x1="362" y1="162" x2="598" y2="162" stroke="#2563eb" stroke-width="2" marker-end="url(#flecha)"/>

    <text x="480" y="207"><tspan font-weight="700" fill="#16a34a">SELECT</tspan> .select("id, nombre…")</text>
    <line x1="362" y1="217" x2="598" y2="217" stroke="#16a34a" stroke-width="2" marker-end="url(#flecha)"/>

    <text x="480" y="262"><tspan font-weight="700" fill="#dc2626">DELETE</tspan> .delete().eq("id", id)</text>
    <line x1="362" y1="272" x2="598" y2="272" stroke="#dc2626" stroke-width="2" marker-end="url(#flecha)"/>

    <text x="480" y="327" fill="#475569">respuesta { data, error, status }</text>
    <line x1="598" y1="337" x2="362" y2="337" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#flecha)"/>
  </g>
  <text x="480" y="372" text-anchor="middle" font-size="12" fill="#64748b">HTTPS · API REST</text>

  <!-- ================= SUPABASE ================= -->
  <rect x="600" y="70" width="330" height="360" rx="12" fill="#ecfdf3" stroke="#2f9e5b" stroke-width="2"/>
  <text x="765" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">Supabase (PostgreSQL)</text>

  <rect x="620" y="120" width="290" height="60" rx="8" fill="#ffffff" stroke="#86d1a3"/>
  <text x="765" y="145" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">API REST (PostgREST)</text>
  <text x="765" y="166" text-anchor="middle" font-size="12" fill="#475569">Clave publicable → rol anon</text>

  <rect x="620" y="195" width="290" height="60" rx="8" fill="#ffffff" stroke="#86d1a3"/>
  <text x="765" y="220" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Permisos de tabla (GRANT)</text>
  <text x="765" y="241" text-anchor="middle" font-size="12" fill="#475569">insert · select (sin email) · delete</text>

  <rect x="620" y="270" width="290" height="60" rx="8" fill="#ffffff" stroke="#86d1a3"/>
  <text x="765" y="295" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Row Level Security (RLS)</text>
  <text x="765" y="316" text-anchor="middle" font-size="12" fill="#475569">Políticas: insertar · leer · eliminar</text>

  <rect x="620" y="345" width="290" height="65" rx="8" fill="#dcfce7" stroke="#2f9e5b"/>
  <text x="765" y="368" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Tabla public.alumnos</text>
  <text x="765" y="392" text-anchor="middle" font-size="11.5" font-family="Consolas, Menlo, monospace" fill="#475569">id · nombre · email · curso · created_at</text>

  <!-- flechas internas supabase -->
  <line x1="765" y1="180" x2="765" y2="194" stroke="#475569" stroke-width="1.5" marker-end="url(#flecha)"/>
  <line x1="765" y1="255" x2="765" y2="269" stroke="#475569" stroke-width="1.5" marker-end="url(#flecha)"/>
  <line x1="765" y1="330" x2="765" y2="344" stroke="#475569" stroke-width="1.5" marker-end="url(#flecha)"/>

  <!-- ================= SCRIPTS SQL ================= -->
  <rect x="30" y="460" width="900" height="120" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="50" y="488" font-size="15" font-weight="700" fill="#334155">Carpeta sql/ — se ejecuta en Supabase › SQL Editor</text>
  <line x1="765" y1="460" x2="765" y2="432" stroke="#475569" stroke-width="1.5" marker-end="url(#flecha)"/>

  <g font-size="12" text-anchor="middle">
    <rect x="50" y="503" width="205" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="152" y="527" font-family="Consolas, Menlo, monospace" font-weight="700" fill="#0f172a">01-crear-tabla</text>
    <text x="152" y="546" fill="#475569">Tabla + RLS + INSERT</text>

    <rect x="267" y="503" width="205" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="369" y="527" font-family="Consolas, Menlo, monospace" font-weight="700" fill="#0f172a">02-desafio-modalidad</text>
    <text x="369" y="546" fill="#475569">Columna "modalidad"</text>

    <rect x="484" y="503" width="205" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="586" y="527" font-family="Consolas, Menlo, monospace" font-weight="700" fill="#0f172a">03-lectura-registros</text>
    <text x="586" y="546" fill="#475569">SELECT sin el email</text>

    <rect x="701" y="503" width="205" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="803" y="527" font-family="Consolas, Menlo, monospace" font-weight="700" fill="#0f172a">04-eliminar-registros</text>
    <text x="803" y="546" fill="#475569">DELETE por id</text>
  </g>
</svg>
